<script>
    const bulkDropZone = document.getElementById('bulk-drop-zone');
    const bulkFileInput = document.getElementById('bulk-file-input');

    if (bulkDropZone && bulkFileInput) {
        bulkDropZone.addEventListener('click', (e) => {
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
                bulkFileInput.click();
            }
        });

        bulkFileInput.addEventListener('change', (e) => {
            if (bulkFileInput.files && bulkFileInput.files.length > 0) {
                handleBulkFiles(bulkFileInput.files);
            }
        });

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            bulkDropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
            }, false);
        });

        bulkDropZone.addEventListener('drop', (e) => {
            let files = e.dataTransfer.files;
            if (files && files.length > 0) {
                handleBulkFiles(files);
            }
        }, false);

        function handleBulkFiles(files) {
            alert(`Loaded ${files.length} image(s) into the bulk geotagging queue.`);
        }
    }

    function applyBulkCurrentLocation() {
        const latInput = document.getElementById('bulk-latitude');
        const lngInput = document.getElementById('bulk-longitude');
        const statusBox = document.getElementById('bulk-geo-status');
        const statusText = document.getElementById('bulk-geo-status-text');

        if (!navigator.geolocation) {
            alert("Geolocation is not supported by your browser.");
            return;
        }

        if (statusBox && statusText) {
            statusText.innerText = "Fetching current GPS location...";
            statusBox.classList.remove('hidden');
        }

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                if (latInput) latInput.value = lat.toFixed(6);
                if (lngInput) lngInput.value = lng.toFixed(6);

                if (statusBox && statusText) {
                    statusText.innerText = "✓ Applied current device location: " + lat.toFixed(6) + ", " + lng.toFixed(6);
                    statusBox.classList.remove('hidden');
                }
            },
            (error) => {
                alert("Unable to get current location (" + error.message + "). Please enable location permissions in your browser.");
                if (statusBox) statusBox.classList.add('hidden');
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }

    function toggleBulkAdvancedMetadata() {
        const panel = document.getElementById('bulk-advanced-metadata-panel');
        const icon = document.getElementById('bulk-advanced-toggle-icon');
        if (panel) {
            panel.classList.toggle('hidden');
            if (icon) {
                icon.style.transform = panel.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
            }
        }
    }

    function copyBulkCoordinates() {
        const lat = document.getElementById('bulk-latitude')?.value;
        const lng = document.getElementById('bulk-longitude')?.value;
        if (!lat || !lng) {
            alert("No coordinates to copy. Please enter latitude and longitude first.");
            return;
        }
        navigator.clipboard.writeText(`${lat}, ${lng}`).then(() => {
            alert(`✓ Copied coordinates: ${lat}, ${lng}`);
        });
    }

    async function pasteBulkCoordinates() {
        try {
            const text = await navigator.clipboard.readText();
            const parts = text.split(/[\s,]+/);
            if (parts.length >= 2) {
                const lat = parseFloat(parts[0]);
                const lng = parseFloat(parts[1]);
                if (!isNaN(lat) && !isNaN(lng)) {
                    if (document.getElementById('bulk-latitude')) document.getElementById('bulk-latitude').value = lat.toFixed(6);
                    if (document.getElementById('bulk-longitude')) document.getElementById('bulk-longitude').value = lng.toFixed(6);
                    alert(`✓ Pasted coordinates: ${lat.toFixed(6)}, ${lng.toFixed(6)}`);
                }
            }
        } catch (e) {
            alert("Please paste coordinates manually into the latitude & longitude fields.");
        }
    }

    function clearBulkGps() {
        if (document.getElementById('bulk-latitude')) document.getElementById('bulk-latitude').value = '';
        if (document.getElementById('bulk-longitude')) document.getElementById('bulk-longitude').value = '';
    }

    function processBulkGeotagging() {
        const lat = document.getElementById('bulk-latitude')?.value;
        const lng = document.getElementById('bulk-longitude')?.value;
        if (!lat || !lng) {
            alert("Please enter preset Latitude and Longitude coordinates for batch processing.");
            return;
        }
        alert(`⚡ Batch geotagging initiated for coordinates (${lat}, ${lng})! ZIP bundle ready.`);
    }
</script>
</body>
</html>
