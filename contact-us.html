<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Contact Support | GeotaggingPhotos.com</title>
<meta content="Get in touch with GeotaggingPhotos.com support team for technical assistance, API inquiries, or custom enterprise solutions." name="description"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-bright": "#f7f9fb",
                        "inverse-surface": "#2d3133",
                        "on-surface": "#191c1e",
                        "outline": "#76777d",
                        "outline-variant": "#c6c6cd",
                        "secondary": "#0051d5",
                        "primary": "#000000",
                        "on-surface-variant": "#45464d",
                        "background": "#f7f9fb",
                        "surface": "#f7f9fb",
                        "surface-container-low": "#f2f4f6",
                        "surface-container-lowest": "#ffffff"
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                    spacing: { "gutter": "24px", "margin-mobile": "16px", "margin-desktop": "40px", "container-max": "1280px", "unit": "8px" },
                    fontFamily: { "body-lg": ["Inter"], "headline-lg": ["Geist"], "display": ["Geist"], "label-md": ["Geist"], "body-md": ["Inter"] }
                }
            }
        }
    </script>
<style>
        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05); }
        .gradient-btn { background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%); transition: all 0.4s ease; }
    </style>
<script src="components.js"></script>
</head>
<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col pt-16">
<div id="header-placeholder"></div>

<main class="flex-grow pt-8 pb-16 px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto w-full">
<div class="max-w-2xl mx-auto space-y-8">
<div class="text-center space-y-4">
<h1 class="font-display text-display text-primary">Get in Touch</h1>
<p class="font-body-lg text-on-surface-variant">Have questions or feedback? Send us a message and our support team will respond within 24 hours.</p>
</div>
<div class="glass-panel p-8 rounded-2xl space-y-6">
<form onsubmit="event.preventDefault(); alert('Message sent successfully!');" class="space-y-4">
<div>
<label class="block text-sm font-semibold text-primary mb-1">Your Name</label>
<input type="text" required class="w-full bg-surface-container-lowest border border-outline-variant/40 rounded-lg p-3 text-on-surface focus:outline-none focus:border-secondary" placeholder="John Doe"/>
</div>
<div>
<label class="block text-sm font-semibold text-primary mb-1">Email Address</label>
<input type="email" required class="w-full bg-surface-container-lowest border border-outline-variant/40 rounded-lg p-3 text-on-surface focus:outline-none focus:border-secondary" placeholder="john@example.com"/>
</div>
<div>
<label class="block text-sm font-semibold text-primary mb-1">Message</label>
<textarea rows="4" required class="w-full bg-surface-container-lowest border border-outline-variant/40 rounded-lg p-3 text-on-surface focus:outline-none focus:border-secondary" placeholder="How can we help you?"></textarea>
</div>
<button type="submit" class="w-full gradient-btn text-white py-3 rounded-lg font-semibold shadow-md">Send Message</button>
</form>
</div>
</div>
</main>

<div id="footer-placeholder"></div>
</body>
</html>
