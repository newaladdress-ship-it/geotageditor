<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');

    if (dropZone && fileInput) {
        dropZone.addEventListener('click', (e) => {
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
                fileInput.click();
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (fileInput.files && fileInput.files[0]) {
                handleUploadedPhoto(fileInput.files[0]);
            }
        });

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            let files = e.dataTransfer.files;
            if (files && files[0]) {
                handleUploadedPhoto(files[0]);
            }
        }, false);

        function handleUploadedPhoto(file) {
            const imageUrl = URL.createObjectURL(file);
            const fileSizeMB = (file.size / (1024 * 1024)).toFixed(2);

            dropZone.innerHTML = `
                <div class="relative w-full h-full min-h-[220px] flex flex-col items-center justify-center p-2 group">
                    <img src="${imageUrl}" alt="${file.name}" class="max-h-[200px] w-auto object-contain rounded-xl shadow-md mb-2" />
                    <span class="font-bold text-sm text-primary truncate max-w-full">${file.name}</span>
                    <span class="text-xs font-mono-data text-on-surface-variant">${fileSizeMB} MB</span>
                    <button type="button" onclick="location.reload()" class="mt-2 text-xs text-secondary hover:underline font-semibold flex items-center gap-1">
                        <span class="material-symbols-outlined text-xs">refresh</span> Change Photo
                    </button>
                </div>
            `;

            detectAndApplyCurrentLocation();
        }

        function detectAndApplyCurrentLocation() {
            const inputs = document.querySelectorAll('input[type="text"]');
            let latInput = document.getElementById('latitude');
            let lngInput = document.getElementById('longitude');

            if (!latInput && inputs[0]) latInput = inputs[0];
            if (!lngInput && inputs[1]) lngInput = inputs[1];

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        if (latInput) latInput.value = position.coords.latitude.toFixed(6);
                        if (lngInput) lngInput.value = position.coords.longitude.toFixed(6);
                    },
                    (error) => {
                        if (latInput && !latInput.value) latInput.value = '40.712776';
                        if (lngInput && !lngInput.value) lngInput.value = '-74.005974';
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            } else {
                if (latInput && !latInput.value) latInput.value = '40.712776';
                if (lngInput && !lngInput.value) lngInput.value = '-74.005974';
            }
        }
    }
</script>
